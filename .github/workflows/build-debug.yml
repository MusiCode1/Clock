name: build-debug

# Builds a debug APK for verifying the ALARM_AT_MILLIS extra.
# Debug uses applicationIdSuffix ".debug", so it installs alongside a
# store build instead of replacing it.
on:
  push:
    branches: [ "feat/**" ]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore pinned debug keystore
        # Stable signature across builds → pm install -r works on a real phone.
        # Secret absent (e.g. a fork without it) → fall back to the ephemeral key.
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_B64" ]; then
            printf '%s' "$DEBUG_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/debug.keystore"
            echo "DEBUG_KEYSTORE_FILE=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"
            echo "pinned debug keystore restored ($(wc -c < "$RUNNER_TEMP/debug.keystore") bytes)"
          else
            echo "no DEBUG_KEYSTORE_B64 secret; using ephemeral debug key"
          fi

      - name: assembleDebug
        # gradlew is mode 100644 upstream, so ./gradlew exits 126. Fixed here
        # rather than by changing a file the fork inherits.
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: locate apk
        id: apk
        run: |
          set -eu
          path="$(find app/build/outputs/apk/debug -name '*.apk' | head -1)"
          test -n "$path"
          echo "path=$path" >> "$GITHUB_OUTPUT"
          ls -l "$path"

      - uses: actions/upload-artifact@v4
        with:
          name: clock-debug-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
